[workspace]
resolver = "2"
members = [
  "crates/bollo-protocol",
  "crates/bollo-policy",
  "crates/bollo-workspace",
  "crates/bollo-tools",
  "crates/bollo-providers",
  "crates/bollo-store",
  "crates/bollo-extensions",
  "crates/bollo-modes",
  "crates/bollo-core",
  "crates/bollo-tui",
  "crates/bollo-cli",
  "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
ctrlc = "3"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
tempfile = "3"

[profile.release]
lto = "thin"
