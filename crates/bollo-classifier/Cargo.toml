[package]
name = "bollo-classifier"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bollo-policy = { path = "../bollo-policy" }
bollo-providers = { path = "../bollo-providers" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
bollo-protocol = { path = "../bollo-protocol" }

[features]
default = []
# Same explicit gate as provider HTTPS: the default build has no live transport
# and therefore no classifier traffic.
live-http = ["bollo-providers/live-http"]
