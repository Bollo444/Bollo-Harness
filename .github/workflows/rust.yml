name: Rust workspace (Windows)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      # The toolchain is pinned in rust-toolchain.toml, so this cache is keyed
      # on that pin and the lockfile: a toolchain or dependency change starts
      # clean, while repeat runs reuse the registry and the build directory.
      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: "${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}"
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Rust 1.93.1
        run: |
          # rust-toolchain.toml pins this same version for every cargo call.
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup default 1.93.1
          rustc --version
          cargo --version
          # Layout evidence: the containment grants follow the toolchain the
          # host actually runs, so a red run can be read from the log.
          rustc --print sysroot
          rustup toolchain list
          where.exe cargo rustc
          Write-Host "USERPROFILE=$env:USERPROFILE RUSTUP_HOME=$env:RUSTUP_HOME CARGO_HOME=$env:CARGO_HOME"
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace (bollo-api excluded)
        run: cargo test --workspace --exclude bollo-api --no-fail-fast --locked
      # bollo-api's loopback HTTP tests contend for ephemeral ports when run in
      # parallel; they run single-threaded for a deterministic result.
      - name: Test bollo-api (single-threaded)
        run: cargo test -p bollo-api --no-fail-fast --locked -- --test-threads=1
