name: Rust workspace (Windows)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      # The toolchain is pinned in rust-toolchain.toml, so the cache is keyed on
      # that pin and the lockfile: a toolchain or dependency change starts clean,
      # while repeat runs reuse the registry and the build directory.
      # Restore and save are separate steps so a red run still warms the cache:
      # the combined form saves only on success, and its `save-always` input is
      # deprecated and no longer honored.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: "${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}"
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Rust 1.93.1
        run: |
          # rust-toolchain.toml pins this same version for every cargo call.
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup default 1.93.1
          rustc --version
          cargo --version
          # Layout evidence: the containment grants follow the toolchain the
          # host actually runs, so a red run can be read from the log.
          rustc --print sysroot
          rustup toolchain list
          where.exe cargo rustc
          Write-Host "USERPROFILE=$env:USERPROFILE RUSTUP_HOME=$env:RUSTUP_HOME CARGO_HOME=$env:CARGO_HOME"
      - name: Build workspace
        run: cargo build --workspace --locked
      # Runner-only containment failures are diagnosed from this capture: it
      # records how the host resolves rustc, what the container token carries,
      # the file DACLs and labels, and raw Win32 open/execute results from
      # inside the container. The artifact is uploaded even when the test below
      # fails, and the step never gates the job.
      - name: Capture container diagnostics
        if: always()
        continue-on-error: true
        run: cargo run -p bollo-workspace --locked --example container_diagnostics -- --out container-diagnostics.json
      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-diagnostics
          path: container-diagnostics.json
          if-no-files-found: warn

      - name: Test workspace (bollo-api excluded)
        run: cargo test --workspace --exclude bollo-api --no-fail-fast --locked
      # bollo-api's loopback HTTP tests contend for ephemeral ports when run in
      # parallel; they run single-threaded for a deterministic result.
      - name: Test bollo-api (single-threaded)
        run: cargo test -p bollo-api --no-fail-fast --locked -- --test-threads=1

      # The containment evidence is published instead of transcribed: the same two
      # suites the gate above runs, one test at a time and timed, printed as the
      # paste-ready block the validation log quotes. It never gates the job (the
      # test steps above do) and it runs even when they failed, which is what makes
      # a red run readable.
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.11'
      - name: Containment evidence
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/containment_evidence.py
          $block = 'target/containment-evidence/evidence.md'
          if (Test-Path $block) {
            Get-Content $block -Raw -Encoding utf8 |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-evidence
          path: target/containment-evidence/evidence.md
          if-no-files-found: warn

      # Save even when a test above failed, so a red run still warms the next
      # one, but skip it on an exact hit: the service refuses a duplicate key
      # (run 37267857740 logged "Unable to reserve cache ... another job may be
      # creating this cache") and the cache is already there.
      - name: Save cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
